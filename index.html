<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>NepMart — Discover More. Shop Smarter.</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Inter:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <div class="bar">
      Free delivery inside Kathmandu Valley above रु 3,000 · Use WELCOME10 for
      10% off
    </div>
    <header class="nav">
      <a href="#/" class="logo" aria-label="NepMart home">Nep<b>Mart</b></a>
      <form class="search" role="search" onsubmit="return false;">
        <input
          id="q"
          type="search"
          placeholder="Search dhaka topi, tea, singing bowl…"
          aria-label="Search products"
          autocomplete="off"
        />
        <ul id="sugg" role="listbox" hidden></ul>
      </form>
      <nav aria-label="Main">
        <a href="#/shop">Shop</a><a href="#/account" id="auth-link">Log in</a
        ><button class="nav-logout" id="nav-logout" type="button" hidden>
          Log out</button
        ><a href="#/track">Track order</a
        ><a href="#/cart" class="cartlink">Cart <span id="cc">0</span></a>
      </nav>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer>
      <p><b>NepMart</b> — Discover More. Shop Smarter.</p>
      <p>
        Demo project. No real payments are processed and no wallet credentials
        are ever collected.
      </p>
    </footer>
    <div id="modal" class="modal" hidden>
      <div
        class="sheet"
        role="dialog"
        aria-modal="true"
        aria-labelledby="mt"
      ></div>
    </div>
    <div id="toasts" aria-live="polite"></div>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
